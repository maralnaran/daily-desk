<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Desk</title>
<style>
:root{--bg:#fdeff6;--panel:#fff;--ink:#3a2a3c;--mute:#8d7893;--line:#f6dfea;--accent:#d8468b;--accent2:#6cc3f2;--accent-ink:#fff;--soft:#fde1ee;--warn:#2f86c4;--side:#2f86c4;--side2:#e0559a;--shadow:0 1px 2px rgba(216,70,139,.06),0 8px 24px rgba(108,195,242,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1020;--panel:#271a2e;--ink:#fbe9f3;--mute:#b497ba;--line:#3a2a42;--accent:#ff7eb6;--accent-ink:#3a0b22;--accent2:#7cc8f0;--soft:#3a2540;--warn:#4aa3dc;--side:#1f4a66;--side2:#8a3466;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1020;--panel:#271a2e;--ink:#fbe9f3;--mute:#b497ba;--line:#3a2a42;--accent:#ff7eb6;--accent-ink:#3a0b22;--accent2:#7cc8f0;--soft:#3a2540;--warn:#4aa3dc;--side:#1f4a66;--side2:#8a3466;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:1080px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto auto 1fr;column-gap:24px;align-items:start}
header{grid-column:1;grid-row:1;display:block;background:linear-gradient(160deg,var(--side2),var(--side));color:#fff;border-radius:20px 20px 0 0;padding:26px 22px 14px}
h1{font:700 30px/1.1 Georgia,"Iowan Old Style",serif;margin:0 0 6px;letter-spacing:-.01em}
.date{color:var(--mute);font-size:14px}
header .date{color:rgba(255,255,255,.7);margin-bottom:14px}
header .btn{background:rgba(255,255,255,.12);color:#fff;border:0}
nav{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:4px;background:var(--side);border-radius:0 0 20px 20px;padding:6px 12px 16px;margin:0;border:0;box-shadow:var(--shadow)}
nav button{text-align:left;min-width:0;border:0;background:none;color:rgba(255,255,255,.72);font:600 15px inherit;font-family:inherit;padding:11px 14px;border-radius:11px;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button[aria-selected="true"]{background:#fff;color:#c23a7c}
section,#progress,#notes{grid-column:2;grid-row:1/span 3}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:11px 14px;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=text]{flex:1;min-width:160px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 20px;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--ink);border:0}
.btn.sm{padding:7px 14px;font-size:14px}
ul{list-style:none;margin:16px 0 0;padding:0}
li.t{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--bg);border-radius:12px}
li.t span.x{flex:1;word-break:break-word}
li.t.done span.x{text-decoration:line-through;color:var(--mute)}
.pri{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.pri.high{background:var(--warn);color:#fff}
.del{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;border-radius:8px;width:30px;height:30px}
.del:hover{background:var(--soft);color:var(--warn)}
.empty{color:var(--mute);margin:16px 0 0;padding:22px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}
.timer{text-align:center;--p:0}
.clock{width:250px;height:250px;margin:22px auto;border-radius:50%;display:grid;place-items:center;font:700 58px/1 Georgia,serif;font-variant-numeric:tabular-nums;position:relative;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--soft) 0)}
.clock::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--panel)}
.clock{z-index:0}
.clock{isolation:isolate}
.clock::before{z-index:-1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:14px}
.stat{border-top:4px solid var(--accent);padding:18px 20px}
.stat:nth-child(2){border-top-color:var(--accent2)}.stat:nth-child(3){border-top-color:var(--warn)}
.stat b{display:block;font:700 36px/1.15 Georgia,serif}
.stat span{color:var(--mute);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;margin-top:14px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:8px;min-height:3px}
.notes{display:grid;grid-template-columns:230px 1fr;gap:14px}
.nl{margin-top:12px}
.nl button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;margin-bottom:4px;color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.nl button:hover{background:var(--bg)}
.nl button[aria-current="true"]{background:var(--soft)}
.nl small{display:block;color:var(--mute);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{width:100%;min-height:340px;resize:vertical;line-height:1.6}
h2{font:700 20px Georgia,serif;margin:0 0 4px}
@media(max-width:760px){.app{display:block;padding:14px 14px 48px}header{border-radius:20px 20px 0 0}nav{flex-direction:row;overflow-x:auto;border-radius:0 0 20px 20px;margin-bottom:16px}nav button{white-space:nowrap}.notes{grid-template-columns:1fr}.clock{width:210px;height:210px;font-size:48px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Daily Desk</h1><div class="date" id="date"></div></div>
<button class="btn ghost sm" id="theme">Switch theme</button></header>
<nav role="tablist">
<button role="tab" data-t="tasks" aria-selected="true">Tasks</button>
<button role="tab" data-t="focus" aria-selected="false">Study timer</button>
<button role="tab" data-t="progress" aria-selected="false">Progress</button>
<button role="tab" data-t="notes" aria-selected="false">Notes</button>
</nav>

<section id="tasks" class="card">
<h2>Today’s tasks</h2>
<div class="row" style="margin-top:8px">
<input type="text" id="tin" placeholder="What do you need to do?" aria-label="New task">
<select id="tpri" aria-label="Priority"><option value="normal">Normal</option><option value="high">High</option></select>
<button class="btn" id="tadd">Add task</button></div>
<ul id="tlist"></ul>
<div class="row" style="margin-top:14px"><button class="btn ghost sm" id="tclear">Clear completed</button></div>
</section>

<section id="focus" class="card timer" hidden>
<h2>Study timer</h2>
<div class="row" style="justify-content:center;margin-top:8px">
<input type="text" id="subj" placeholder="Subject, e.g. Algorithms" aria-label="Subject" style="max-width:260px">
<select id="mins" aria-label="Minutes"><option>25</option><option>45</option><option>50</option><option>15</option><option>5</option></select></div>
<div class="clock" id="clock" role="timer">25:00</div>
<div class="row" style="justify-content:center">
<button class="btn" id="start">Start</button><button class="btn ghost" id="reset">Reset</button></div>
<p class="date" id="fmsg">Finished sessions are logged automatically.</p>
<ul id="slist" style="text-align:left"></ul>
</section>

<section id="progress" hidden>
<div class="grid">
<div class="card stat"><b id="s1">0</b><span>Tasks done today</span></div>
<div class="card stat"><b id="s2">0</b><span>Focus minutes today</span></div>
<div class="card stat"><b id="s3">0</b><span>Day streak</span></div>
<div class="card stat"><b id="s4">0</b><span>Focus minutes this week</span></div></div>
<div class="card"><h2>Focus minutes, last 7 days</h2><div class="bars" id="bars"></div></div>
<div class="card" style="margin-top:12px"><h2>By subject, last 7 days</h2><ul id="bysub"></ul></div>
<div class="row" style="margin-top:12px"><button class="btn ghost sm" id="exp">Export backup</button>
<label class="btn ghost sm" style="cursor:pointer">Import backup<input type="file" id="imp" accept=".json" hidden></label></div>
</section>

<section id="notes" hidden>
<div class="notes">
<div class="card"><button class="btn" id="nnew" style="width:100%">New note</button><div class="nl" id="nlist"></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><input type="text" id="ntitle" placeholder="Title" aria-label="Note title"><button class="btn ghost sm" id="ndel">Delete</button></div>
<textarea id="nbody" placeholder="Write something. It saves as you type." aria-label="Note body"></textarea></div>
</div></section>
</div>

<script>
(function(){
var K='dailydesk.v1',S={tasks:[],sessions:[],notes:[],cur:null};
function load(){try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function day(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
load();
$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

/* theme */
$('theme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};

/* tabs */
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
function go(t){document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t)});
['tasks','focus','progress','notes'].forEach(function(s){$(s).hidden=s!==t});
try{if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}catch(e){}
if(t==='progress')stats();if(t==='focus')sessions();if(t==='notes')notes()}

/* tasks */
function tasks(){var l=$('tlist');l.innerHTML='';
if(!S.tasks.length){l.innerHTML='<p class="empty">Nothing here yet. Add your first task above.</p>';return}
S.tasks.slice().sort(function(a,b){return a.done-b.done||(b.pri==='high')-(a.pri==='high')}).forEach(function(t){
var li=document.createElement('li');li.className='t'+(t.done?' done':'');
li.innerHTML='<input type="checkbox" '+(t.done?'checked':'')+' aria-label="Done"><span class="x">'+esc(t.text)+'</span>'+(t.pri==='high'?'<span class="pri high">High</span>':'')+'<button class="del" aria-label="Delete task">×</button>';
li.querySelector('input').onchange=function(){t.done=!t.done;t.at=t.done?day():null;save();tasks()};
li.querySelector('.del').onclick=function(){S.tasks=S.tasks.filter(function(x){return x!==t});save();tasks()};
l.appendChild(li)})}
function addT(){var v=$('tin').value.trim();if(!v)return;S.tasks.push({text:v,pri:$('tpri').value,done:false});$('tin').value='';save();tasks()}
$('tadd').onclick=addT;$('tin').onkeydown=function(e){if(e.key==='Enter')addT()};
$('tclear').onclick=function(){S.tasks=S.tasks.filter(function(t){return !t.done});save();tasks()};

/* timer */
var total=1500,left=1500,iv=null,endAt=0;
function draw(){$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('focus').style.setProperty('--p',total?(1-left/total):0);document.title=iv?$('clock').textContent+' · Daily Desk':'Daily Desk'}
$('mins').onchange=function(){if(!iv){total=left=$('mins').value*60;draw()}};
$('start').onclick=function(){
if(iv){clearInterval(iv);iv=null;$('start').textContent='Resume';draw();return}
endAt=Date.now()+left*1000;$('start').textContent='Pause';
iv=setInterval(function(){left=Math.max(0,Math.round((endAt-Date.now())/1000));draw();if(left<=0)finish()},500)};
$('reset').onclick=function(){clearInterval(iv);iv=null;total=left=$('mins').value*60;$('start').textContent='Start';draw()};
function finish(){clearInterval(iv);iv=null;var m=Math.round(total/60);
S.sessions.push({d:day(),m:m,s:$('subj').value.trim()||'General',t:Date.now()});save();
$('start').textContent='Start';left=total;draw();$('fmsg').textContent='Session complete: '+m+' minutes logged. Take a short break.';sessions();
try{new AudioContext().resume()}catch(e){}}
function sessions(){var l=$('slist');l.innerHTML='';
S.sessions.filter(function(s){return s.d===day()}).reverse().forEach(function(s){var li=document.createElement('li');li.className='t';li.innerHTML='<span class="x">'+esc(s.s)+'</span><span class="pri">'+s.m+' min</span>';l.appendChild(li)})}

/* progress */
function stats(){var today=day(),tdone=S.tasks.filter(function(t){return t.done&&t.at===today}).length;
var by={},i,d;for(i=0;i<7;i++){d=new Date();d.setDate(d.getDate()-(6-i));by[day(d)]={n:d.toLocaleDateString(undefined,{weekday:'short'}),m:0}}
var subs={};S.sessions.forEach(function(s){if(by[s.d]){by[s.d].m+=s.m;subs[s.s]=(subs[s.s]||0)+s.m}});
var keys=Object.keys(by),max=Math.max.apply(null,keys.map(function(k){return by[k].m}).concat([30])),wk=0;
$('bars').innerHTML=keys.map(function(k){wk+=by[k].m;return '<div class="bar"><span>'+by[k].m+'</span><i style="height:'+Math.round(by[k].m/max*100)+'%"></i><span>'+by[k].n+'</span></div>'}).join('');
var act={};S.sessions.forEach(function(s){act[s.d]=1});S.tasks.forEach(function(t){if(t.at)act[t.at]=1});
var st=0;d=new Date();if(!act[day(d)])d.setDate(d.getDate()-1);while(act[day(d)]){st++;d.setDate(d.getDate()-1)}
$('s1').textContent=tdone;$('s2').textContent=by[today].m;$('s3').textContent=st;$('s4').textContent=wk;
var names=Object.keys(subs).sort(function(a,b){return subs[b]-subs[a]});
$('bysub').innerHTML=names.length?names.map(function(n){return '<li class="t"><span class="x">'+esc(n)+'</span><span class="pri">'+subs[n]+' min</span></li>'}).join(''):'<p class="empty">Finish a study session to see subjects here.</p>'}
$('exp').onclick=function(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='daily-desk-backup.json';a.click()};
$('imp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=Object.assign(S,JSON.parse(r.result));save();tasks();stats()}catch(x){alert('That file could not be read as a Daily Desk backup.')}};r.readAsText(f)};

/* notes */
function notes(){var l=$('nlist');l.innerHTML='';
if(!S.notes.length){l.innerHTML='<p class="empty">No notes yet.</p>';$('ntitle').value=$('nbody').value='';return}
if(!S.notes.some(function(n){return n.id===S.cur}))S.cur=S.notes[0].id;
S.notes.slice().sort(function(a,b){return b.u-a.u}).forEach(function(n){var b=document.createElement('button');b.setAttribute('aria-current',n.id===S.cur);
b.innerHTML=esc(n.title||'Untitled')+'<small>'+esc((n.body||'').slice(0,40))+'</small>';b.onclick=function(){S.cur=n.id;notes()};l.appendChild(b)});
var c=cur();$('ntitle').value=c.title;$('nbody').value=c.body}
function cur(){return S.notes.filter(function(n){return n.id===S.cur})[0]}
$('nnew').onclick=function(){var n={id:Date.now(),title:'',body:'',u:Date.now()};S.notes.push(n);S.cur=n.id;save();notes();$('ntitle').focus()};
function edit(){var c=cur();if(!c)return;c.title=$('ntitle').value;c.body=$('nbody').value;c.u=Date.now();save()}
$('ntitle').oninput=edit;$('nbody').oninput=edit;
$('ntitle').onchange=$('nbody').onchange=notes;
$('ndel').onclick=function(){var c=cur();if(!c||!confirm('Delete this note?'))return;S.notes=S.notes.filter(function(n){return n!==c});S.cur=null;save();notes()};

tasks();draw();sessions();
var h=location.hash.slice(1);go(['tasks','focus','progress','notes'].indexOf(h)>-1?h:'tasks');
})();
</script>
</body>
</html>
